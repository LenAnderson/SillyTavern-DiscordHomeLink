<div id="stdhl--settings">
	<div class="inline-drawer">
		<div class="inline-drawer-toggle inline-drawer-header">
			<b>Discord Home Link</b>
			<div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
		</div>
		<div class="inline-drawer-content" style="font-size:small;">
			<div class="flex-container">
                <label class="checkbox_label">
                    <input id="stdhl--separators" type="checkbox">
                    <span class="stdhl--text">
                        Show separators between accounts and other options
                        <br>
                        <small></small>
                    </span>
				</label>
            </div>

            <hr>

            <div class="flex-container">
                <strong>Move top bar buttons into Discord Home Link menu</strong>
            </div>
            <div id="stdhl--settings-topBarWrapper"></div>
            <template id="stdhl--settings-topBarTemplate">
                <div class="flex-container stdhl--settings-topBarSetting">
                    <label class="checkbox_label">
                        <input type="checkbox">
                        <span class="stdhl--text">
                            <span class="stdhl--icon"></span>
                            <span class="stdhl--primary"></span>
                            <br>
                            <small class="stdhl--secondary"></small>
                        </span>
                    </label>
                </div>
            </template>
		</div>
	</div>
</div>
